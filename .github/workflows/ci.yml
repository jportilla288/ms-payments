name: CI

on:
  push:
    branches: [dev, qa, uat, main, 'feature/**', 'fix/**']
  pull_request:
    branches: [dev, qa, uat, main]
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    name: Build, test and analyse
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ms_payments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ms_payments_test?schema=public
      # Exposed at job level so the Sonar step can check it in its `if`
      # (the `secrets` context is not allowed inside step conditions).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Project scripts instead of npx: nothing is fetched on demand.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:deploy

      # Runs eslint without --fix: CI must report problems, not silently patch them.
      - name: Lint
        run: npm run lint:ci

      - name: Unit tests with coverage
        run: npm run test:cov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/

      # Skipped automatically until SONAR_TOKEN is configured in the repo secrets.
      - name: SonarQube Cloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: https://sonarcloud.io
